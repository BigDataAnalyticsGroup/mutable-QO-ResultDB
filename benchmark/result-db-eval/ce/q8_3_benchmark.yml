description: CE q8_3.
suite: ce
benchmark: ce
name: q8_3
readonly: true
chart:
    x:
        scale: linear
        type: O
        label: JOB Queries
    y:
        scale: linear
        type: Q
        label: 'Execution time [ms]'
    # Defaults: scale is "linear", type is "Q", label is "X" or "Y"
data:
    'dblp8':
        file: 'benchmark/result-db-eval/ce/data/dblp8.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            's': 'INT NOT NULL'
            'd': 'INT NOT NULL'
    'dblp17':
        file: 'benchmark/result-db-eval/ce/data/dblp17.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            's': 'INT NOT NULL'
            'd': 'INT NOT NULL'
    'dblp20':
        file: 'benchmark/result-db-eval/ce/data/dblp20.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            's': 'INT NOT NULL'
            'd': 'INT NOT NULL'


systems:
    mutable:
        args: >-
          --backend WasmV8
          --no-simd
          --cardinality-estimator Injected
          --use-cardinality-file benchmark/result-db-eval/ce/q8_3_injected_cardinalities.json
          --plan-enumerator DPccp
        configurations:                                   # Different experiment configurations.
          'ResultDB_SemiJoin':
            args: >-
              --result-db
            pattern:
              Execution Time: '^Execute machine code:.*'
          'TD_Fold':
            args: >-
              --result-db
              --optimize-result-db
              --td_root
            pattern:
              Execution Time: '^Execute machine code:.*'
          'TD_Fold_NoTVC':
            args: >-
              --result-db
              --optimize-result-db
              --td_root
              --ignore_tvcs
            pattern:
              Execution Time: '^Execute machine code:.*'
          'TD_ResultDB':
            args: >-
              --result-db
              --optimize-result-db
            pattern:
              Execution Time: '^Execute machine code:.*'
          'ResultDB_Decompose':
            args: >-
              --decompose
            pattern:
              Execution Time: '^Execute machine code:.*'
          'GHD_C_Fold':
            args: >-
              --result-db
              --optimize-result-db
              --ghd_c_fold
            pattern:
              Execution Time: '^Execute machine code:.*'
          'GHD_Heuristic':
            args: >-
              --result-db
              --optimize-result-db
              --ghd_heuristic
            pattern:
              Execution Time: '^Execute machine code:.*'
        cases:
            0: 'SELECT * FROM dblp8 AS dblp8_0, dblp8 AS dblp8_1, dblp8 AS dblp8_2, dblp17, dblp20 AS dblp20_4, dblp20 AS dblp20_5 WHERE dblp8_0.s = dblp8_1.s AND dblp8_0.d = dblp8_2.s AND dblp8_1.d = dblp8_2.d AND dblp8_2.d = dblp17.s AND dblp17.s = dblp20_4.s AND dblp17.d = dblp20_5.s AND dblp20_4.d = dblp20_5.d;
'
