description: CE q8_2.
suite: ce
benchmark: ce
name: q8_2
readonly: true
chart:
    x:
        scale: linear
        type: O
        label: JOB Queries
    y:
        scale: linear
        type: Q
        label: 'Execution time [ms]'
    # Defaults: scale is "linear", type is "Q", label is "X" or "Y"
data:
    'dblp9':
        file: 'benchmark/result-db-eval/ce/data/dblp9.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            's': 'INT NOT NULL'
            'd': 'INT NOT NULL'
    'dblp8':
        file: 'benchmark/result-db-eval/ce/data/dblp8.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            's': 'INT NOT NULL'
            'd': 'INT NOT NULL'


systems:
    mutable:
        args: >-
          --backend WasmV8
          --no-simd
          --cardinality-estimator Injected
          --use-cardinality-file benchmark/result-db-eval/ce/q8_2_injected_cardinalities.json
          --plan-enumerator DPccp
        configurations:                                   # Different experiment configurations.
          'ResultDB_SemiJoin':
            args: >-
              --result-db
            pattern:
              Execution Time: '^Execute machine code:.*'
          'TD_Fold':
            args: >-
              --result-db
              --optimize-result-db
              --td_root
            pattern:
              Execution Time: '^Execute machine code:.*'
          'TD_Fold_NoTVC':
            args: >-
              --result-db
              --optimize-result-db
              --td_root
              --ignore_tvcs
            pattern:
              Execution Time: '^Execute machine code:.*'
          'TD_ResultDB':
            args: >-
              --result-db
              --optimize-result-db
            pattern:
              Execution Time: '^Execute machine code:.*'
          'ResultDB_Decompose':
            args: >-
              --decompose
            pattern:
              Execution Time: '^Execute machine code:.*'
          'GHD_C_Fold':
            args: >-
              --result-db
              --optimize-result-db
              --ghd_c_fold
            pattern:
              Execution Time: '^Execute machine code:.*'
          'GHD_Heuristic':
            args: >-
              --result-db
              --optimize-result-db
              --ghd_heuristic
            pattern:
              Execution Time: '^Execute machine code:.*'
        cases:
            0: 'SELECT * FROM dblp9, dblp8 AS dblp8_1, dblp8 AS dblp8_2, dblp8 AS dblp8_3, dblp8 AS dblp8_4, dblp8 AS dblp8_5 WHERE dblp9.s = dblp8_1.s AND dblp9.d = dblp8_2.s AND dblp8_1.d = dblp8_2.d AND dblp8_2.d = dblp8_3.s AND dblp8_3.s = dblp8_4.s AND dblp8_3.d = dblp8_5.s AND dblp8_4.d = dblp8_5.d;
'
