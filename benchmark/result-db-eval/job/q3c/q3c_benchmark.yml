description: Join-Order Benchmark q3c.
suite: job
benchmark: job
name: q3c
readonly: true
chart:
    x:
        scale: linear
        type: O
        label: JOB Queries
    y:
        scale: linear
        type: Q
        label: 'Execution time [ms]'
    # Defaults: scale is "linear", type is "Q", label is "X" or "Y"
data:
    'k':
        file: 'benchmark/result-db-eval/job/q3c/data/3c_k.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'keyword': 'CHAR 74 NOT NULL'
            'phonetic_code': 'CHAR 5'
    'mi':
        file: 'benchmark/result-db-eval/job/q3c/data/3c_mi.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'movie_id': 'INT NOT NULL'
            'info_type_id': 'INT NOT NULL'
            'info': 'CHAR 43 NOT NULL'
            'note': 'CHAR 19'
    'mk':
        file: 'benchmark/result-db-eval/job/q3c/data/3c_mk.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'movie_id': 'INT NOT NULL'
            'keyword_id': 'INT NOT NULL'
    't':
        file: 'benchmark/result-db-eval/job/q3c/data/3c_t.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'title': 'CHAR 100 NOT NULL'
            'imdb_index': 'CHAR 5'
            'kind_id': 'INT NOT NULL'
            'production_year': 'INT'
            'imdb_id': 'INT'
            'phonetic_code': 'CHAR 5'
            'episode_of_id': 'INT'
            'season_nr': 'INT'
            'episode_nr': 'INT'
            'series_years': 'CHAR 9'
            'md5sum': 'CHAR 32'


systems:
    mutable:
        args: >-
          --backend WasmV8
          --no-simd
          --cardinality-estimator Injected
          --use-cardinality-file benchmark/result-db-eval/job/q3c/q3c_acyclic_injected_cardinalities.json
          --plan-enumerator DPccp
        configurations:                                   # Different experiment configurations.
            'WasmV8, ResultDB_SemiJoin':
                args: --result-db
                pattern: '^Process the query:.*'
            'WasmV8, ResultDB_Decompose':
                args: --decompose
                pattern: '^Process the query:.*'
            'WasmV8, TD_Root':
                args: --result-db --optimize-result-db --td_root
                pattern: '^Process the query:.*'
            'WasmV8, TD_RESULTDB':
                args: --result-db --optimize-result-db --td_resultdb
                pattern: '^Process the query:.*'
        cases:
            0: 'SELECT t.title FROM k AS k, mi AS mi, mk AS mk, t AS t WHERE t.id = mi.movie_id AND t.id = mk.movie_id AND k.id = mk.keyword_id;'
