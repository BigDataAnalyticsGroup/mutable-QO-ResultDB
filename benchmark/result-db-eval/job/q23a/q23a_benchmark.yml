description: Join-Order Benchmark q23a.
suite: job
benchmark: job
name: q23a
readonly: true
chart:
    x:
        scale: linear
        type: O
        label: JOB Queries
    y:
        scale: linear
        type: Q
        label: 'Execution time [ms]'
    # Defaults: scale is "linear", type is "Q", label is "X" or "Y"
data:
    'cc':
        file: 'benchmark/result-db-eval/job/q23a/data/23a_cc.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'movie_id': 'INT'
            'subject_id': 'INT NOT NULL'
            'status_id': 'INT NOT NULL'
    'cct1':
        file: 'benchmark/result-db-eval/job/q23a/data/23a_cct1.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'kind': 'CHAR 32 NOT NULL'
    'cn':
        file: 'benchmark/result-db-eval/job/q23a/data/23a_cn.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'name': 'CHAR 100 NOT NULL'
            'country_code': 'CHAR 6'
            'imdb_id': 'INT'
            'name_pcode_nf': 'CHAR 5'
            'name_pcode_sf': 'CHAR 5'
            'md5sum': 'CHAR 32'
    'ct':
        file: 'benchmark/result-db-eval/job/q23a/data/23a_ct.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'kind': 'CHAR 32 NOT NULL'
    'it1':
        file: 'benchmark/result-db-eval/job/q23a/data/23a_it1.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'info': 'CHAR 32 NOT NULL'
    'k':
        file: 'benchmark/result-db-eval/job/q23a/data/23a_k.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'keyword': 'CHAR 74 NOT NULL'
            'phonetic_code': 'CHAR 5'
    'kt':
        file: 'benchmark/result-db-eval/job/q23a/data/23a_kt.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'kind': 'CHAR 15 NOT NULL'
    'mc':
        file: 'benchmark/result-db-eval/job/q23a/data/23a_mc.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'movie_id': 'INT NOT NULL'
            'company_id': 'INT NOT NULL'
            'company_type_id': 'INT NOT NULL'
            'note': 'CHAR 100'
    'mi':
        file: 'benchmark/result-db-eval/job/q23a/data/23a_mi.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'movie_id': 'INT NOT NULL'
            'info_type_id': 'INT NOT NULL'
            'info': 'CHAR 43 NOT NULL'
            'note': 'CHAR 19'
    'mk':
        file: 'benchmark/result-db-eval/job/q23a/data/23a_mk.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'movie_id': 'INT NOT NULL'
            'keyword_id': 'INT NOT NULL'
    't':
        file: 'benchmark/result-db-eval/job/q23a/data/23a_t.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'title': 'CHAR 100 NOT NULL'
            'imdb_index': 'CHAR 5'
            'kind_id': 'INT NOT NULL'
            'production_year': 'INT'
            'imdb_id': 'INT'
            'phonetic_code': 'CHAR 5'
            'episode_of_id': 'INT'
            'season_nr': 'INT'
            'episode_nr': 'INT'
            'series_years': 'CHAR 9'
            'md5sum': 'CHAR 32'


systems:
    mutable:
        args: >-
          --backend WasmV8
          --no-simd
          --cardinality-estimator Injected
          --use-cardinality-file benchmark/result-db-eval/job/q23a/q23a_acyclic_injected_cardinalities.json
          --plan-enumerator DPccp
        configurations:                                   # Different experiment configurations.
            'ResultDB_SemiJoin':
                args: --result-db
                pattern: '^Execute machine code:.*'
            'ResultDB_Decompose':
                args: --decompose
                pattern: '^Execute machine code:.*'
            'TD_Root':
                args: --result-db --optimize-result-db --td_root
                pattern: '^Execute machine code:.*'
            'TD_ResultDB':
                args: --result-db --optimize-result-db --td_resultdb
                pattern: '^Execute machine code:.*'
        cases:
            0: 'SELECT kt.kind, t.title FROM cc AS cc, cct1 AS cct1, cn AS cn, ct AS ct, it1 AS it1, k AS k, kt AS kt, mc AS mc, mi AS mi, mk AS mk, t AS t WHERE kt.id = t.kind_id AND t.id = cc.movie_id AND mk.movie_id = mi.movie_id AND mk.movie_id = mc.movie_id AND mi.movie_id = cc.movie_id AND k.id = mk.keyword_id AND it1.id = mi.info_type_id AND cn.id = mc.company_id AND ct.id = mc.company_type_id AND cct1.id = cc.status_id;'
