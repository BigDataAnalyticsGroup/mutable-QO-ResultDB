description: Join-Order Benchmark q7a.
suite: job
benchmark: job
name: q7a
readonly: true
chart:
    x:
        scale: linear
        type: O
        label: JOB Queries
    y:
        scale: linear
        type: Q
        label: 'Execution time [ms]'
    # Defaults: scale is "linear", type is "Q", label is "X" or "Y"
data:
    'an':
        file: 'benchmark/result-db-eval/job/q7a/data/7a_an.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'person_id': 'INT NOT NULL'
            'name': 'CHAR 16 NOT NULL'
            'imdb_index': 'CHAR 3'
            'name_pcode_cf': 'CHAR 5'
            'name_pcode_nf': 'CHAR 5'
            'surname_pcode': 'CHAR 5'
            'md5sum': 'CHAR 32'
    'ci':
        file: 'benchmark/result-db-eval/job/q7a/data/7a_ci.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'person_id': 'INT NOT NULL'
            'movie_id': 'INT NOT NULL'
            'person_role_id': 'INT'
            'note': 'CHAR 18'
            'nr_order': 'INT'
            'role_id': 'INT NOT NULL'
    'it':
        file: 'benchmark/result-db-eval/job/q7a/data/7a_it.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'info': 'CHAR 32 NOT NULL'
    'lt':
        file: 'benchmark/result-db-eval/job/q7a/data/7a_lt.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'link': 'CHAR 32 NOT NULL'
    'ml':
        file: 'benchmark/result-db-eval/job/q7a/data/7a_ml.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'movie_id': 'INT NOT NULL'
            'linked_movie_id': 'INT NOT NULL'
            'link_type_id': 'INT NOT NULL'
    'n':
        file: 'benchmark/result-db-eval/job/q7a/data/7a_n.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'name': 'CHAR 100 NOT NULL'
            'imdb_index': 'CHAR 9'
            'imdb_id': 'INT'
            'gender': 'CHAR 1'
            'name_pcode_cf': 'CHAR 5'
            'name_pcode_nf': 'CHAR 5'
            'surname_pcode': 'CHAR 5'
            'md5sum': 'CHAR 32'
    'pi':
        file: 'benchmark/result-db-eval/job/q7a/data/7a_pi.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'person_id': 'INT NOT NULL'
            'info_type_id': 'INT NOT NULL'
            'info': 'CHAR 1 NOT NULL'
            'note': 'CHAR 1'
    't':
        file: 'benchmark/result-db-eval/job/q7a/data/7a_t.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'title': 'CHAR 100 NOT NULL'
            'imdb_index': 'CHAR 5'
            'kind_id': 'INT NOT NULL'
            'production_year': 'INT'
            'imdb_id': 'INT'
            'phonetic_code': 'CHAR 5'
            'episode_of_id': 'INT'
            'season_nr': 'INT'
            'episode_nr': 'INT'
            'series_years': 'CHAR 9'
            'md5sum': 'CHAR 32'


systems:
    mutable:
        args: >-
          --backend WasmV8
          --no-simd
          --cardinality-estimator Injected
          --use-cardinality-file benchmark/result-db-eval/job/q7a/q7a_injected_cardinalities.json
          --plan-enumerator DPccp
        configurations:                                   # Different experiment configurations.
            'WasmV8, ResultDB_SemiJoin':
                args: --result-db
                pattern: '^Process the query:.*'
            'WasmV8, ResultDB_Decompose':
                args: --decompose
                pattern: '^Process the query:.*'
            'WasmV8, TD_Root':
                args: --result-db --optimize-result-db --td_root
                pattern: '^Process the query:.*'
            'WasmV8, TD_RESULTDB':
                args: --result-db --optimize-result-db --td_resultdb
                pattern: '^Process the query:.*'
        cases:
            0: 'SELECT n.name,        t.title FROM an AS an,      ci AS ci,      it AS it,      lt AS lt,      ml AS ml,      n AS n,      pi AS pi,      t AS t WHERE an.name LIKE "%a%"   AND it.info = "mini biography"   AND lt.link = "features"   AND n.name_pcode_cf >= "A"   AND n.name_pcode_cf <= "F"   AND (n.gender= "m" OR (n.gender = "f" AND n.name LIKE "B%"))   AND pi.note = "Volker Boehm"   AND t.production_year >= 1980   AND t.production_year <= 1995   AND n.id = an.person_id   AND n.id = pi.person_id   AND ci.person_id = n.id   AND t.id = ci.movie_id   AND ml.linked_movie_id = t.id   AND lt.id = ml.link_type_id   AND it.id = pi.info_type_id;'
