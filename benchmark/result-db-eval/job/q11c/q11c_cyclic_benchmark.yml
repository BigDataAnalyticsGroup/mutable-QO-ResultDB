description: Join-Order Benchmark q11c.
suite: job
benchmark: job
name: q11c
readonly: true
chart:
    x:
        scale: linear
        type: O
        label: JOB Queries
    y:
        scale: linear
        type: Q
        label: 'Execution time [ms]'
    # Defaults: scale is "linear", type is "Q", label is "X" or "Y"
data:
    'cn':
        file: 'benchmark/result-db-eval/job/q11c/data/11c_cn.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'name': 'CHAR 100 NOT NULL'
            'country_code': 'CHAR 6'
            'imdb_id': 'INT'
            'name_pcode_nf': 'CHAR 5'
            'name_pcode_sf': 'CHAR 5'
            'md5sum': 'CHAR 32'
    'ct':
        file: 'benchmark/result-db-eval/job/q11c/data/11c_ct.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'kind': 'CHAR 32 NOT NULL'
    'k':
        file: 'benchmark/result-db-eval/job/q11c/data/11c_k.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'keyword': 'CHAR 74 NOT NULL'
            'phonetic_code': 'CHAR 5'
    'lt':
        file: 'benchmark/result-db-eval/job/q11c/data/11c_lt.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'link': 'CHAR 32 NOT NULL'
    'mc':
        file: 'benchmark/result-db-eval/job/q11c/data/11c_mc.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'movie_id': 'INT NOT NULL'
            'company_id': 'INT NOT NULL'
            'company_type_id': 'INT NOT NULL'
            'note': 'CHAR 100'
    'mk':
        file: 'benchmark/result-db-eval/job/q11c/data/11c_mk.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'movie_id': 'INT NOT NULL'
            'keyword_id': 'INT NOT NULL'
    'ml':
        file: 'benchmark/result-db-eval/job/q11c/data/11c_ml.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'movie_id': 'INT NOT NULL'
            'linked_movie_id': 'INT NOT NULL'
            'link_type_id': 'INT NOT NULL'
    't':
        file: 'benchmark/result-db-eval/job/q11c/data/11c_t.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'title': 'CHAR 100 NOT NULL'
            'imdb_index': 'CHAR 5'
            'kind_id': 'INT NOT NULL'
            'production_year': 'INT'
            'imdb_id': 'INT'
            'phonetic_code': 'CHAR 5'
            'episode_of_id': 'INT'
            'season_nr': 'INT'
            'episode_nr': 'INT'
            'series_years': 'CHAR 9'
            'md5sum': 'CHAR 32'


systems:
    mutable:
        args: >-
          --backend WasmV8
          --no-simd
          --cardinality-estimator Injected
          --use-cardinality-file benchmark/result-db-eval/job/q11c/q11c_cyclic_injected_cardinalities.json
          --plan-enumerator DPccp
        configurations:                                   # Different experiment configurations.
          'ResultDB_SemiJoin':
            args: >-
              --result-db
            pattern:
              Execution Time: '^Execute machine code:.*'
          'TD_Fold':
            args: >-
              --result-db
              --optimize-result-db
              --td_root
            pattern:
              Execution Time: '^Execute machine code:.*'
          'TD_Fold_NoTVC':
            args: >-
              --result-db
              --optimize-result-db
              --td_root
              --ignore_tvcs
            pattern:
              Execution Time: '^Execute machine code:.*'
          'TD_ResultDB':
            args: >-
              --result-db
              --optimize-result-db
            pattern:
              Execution Time: '^Execute machine code:.*'
          'ResultDB_Decompose':
            args: >-
              --decompose
            pattern:
              Execution Time: '^Execute machine code:.*'
          'GHD_Heuristic':
            args: >-
              --result-db
              --optimize-result-db
              --ghd_heuristic
            pattern:
              Execution Time: '^Execute machine code:.*'
          'GHD_C_Fold':
            args: >-
              --result-db
              --optimize-result-db
              --ghd_c_fold
            pattern:
              Execution Time: '^Execute machine code:.*'
        cases:
            0: 'SELECT cn.name FROM cn AS cn, ct AS ct, k AS k, lt AS lt, mc AS mc, mk AS mk, ml AS ml, t AS t WHERE lt.id = ml.link_type_id AND ml.movie_id = t.id AND t.id = mk.movie_id AND mk.keyword_id = k.id AND t.id = mc.movie_id AND mc.company_type_id = ct.id AND mc.company_id = cn.id AND ml.movie_id = mk.movie_id AND ml.movie_id = mc.movie_id AND mk.movie_id = mc.movie_id;'
