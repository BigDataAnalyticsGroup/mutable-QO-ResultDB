description: Join-Order Benchmark q31a.
suite: job
benchmark: job
name: q31a
readonly: true
chart:
    x:
        scale: linear
        type: O
        label: JOB Queries
    y:
        scale: linear
        type: Q
        label: 'Execution time [ms]'
    # Defaults: scale is "linear", type is "Q", label is "X" or "Y"
data:
    'ci':
        file: 'benchmark/result-db-eval/job/q31a/data/31a_ci.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'person_id': 'INT NOT NULL'
            'movie_id': 'INT NOT NULL'
            'person_role_id': 'INT'
            'note': 'CHAR 18'
            'nr_order': 'INT'
            'role_id': 'INT NOT NULL'
    'cn':
        file: 'benchmark/result-db-eval/job/q31a/data/31a_cn.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'name': 'CHAR 100 NOT NULL'
            'country_code': 'CHAR 6'
            'imdb_id': 'INT'
            'name_pcode_nf': 'CHAR 5'
            'name_pcode_sf': 'CHAR 5'
            'md5sum': 'CHAR 32'
    'it1':
        file: 'benchmark/result-db-eval/job/q31a/data/31a_it1.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'info': 'CHAR 32 NOT NULL'
    'it2':
        file: 'benchmark/result-db-eval/job/q31a/data/31a_it2.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'info': 'CHAR 32 NOT NULL'
    'k':
        file: 'benchmark/result-db-eval/job/q31a/data/31a_k.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'keyword': 'CHAR 74 NOT NULL'
            'phonetic_code': 'CHAR 5'
    'mc':
        file: 'benchmark/result-db-eval/job/q31a/data/31a_mc.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'movie_id': 'INT NOT NULL'
            'company_id': 'INT NOT NULL'
            'company_type_id': 'INT NOT NULL'
            'note': 'CHAR 100'
    'mi':
        file: 'benchmark/result-db-eval/job/q31a/data/31a_mi.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'movie_id': 'INT NOT NULL'
            'info_type_id': 'INT NOT NULL'
            'info': 'CHAR 43 NOT NULL'
            'note': 'CHAR 19'
    'mi_idx':
        file: 'benchmark/result-db-eval/job/q31a/data/31a_mi_idx.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'movie_id': 'INT NOT NULL'
            'info_type_id': 'INT NOT NULL'
            'info': 'CHAR 3 NOT NULL'
            'note': 'CHAR 1'
    'mk':
        file: 'benchmark/result-db-eval/job/q31a/data/31a_mk.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'movie_id': 'INT NOT NULL'
            'keyword_id': 'INT NOT NULL'
    'n':
        file: 'benchmark/result-db-eval/job/q31a/data/31a_n.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'name': 'CHAR 100 NOT NULL'
            'imdb_index': 'CHAR 9'
            'imdb_id': 'INT'
            'gender': 'CHAR 1'
            'name_pcode_cf': 'CHAR 5'
            'name_pcode_nf': 'CHAR 5'
            'surname_pcode': 'CHAR 5'
            'md5sum': 'CHAR 32'
    't':
        file: 'benchmark/result-db-eval/job/q31a/data/31a_t.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'title': 'CHAR 100 NOT NULL'
            'imdb_index': 'CHAR 5'
            'kind_id': 'INT NOT NULL'
            'production_year': 'INT'
            'imdb_id': 'INT'
            'phonetic_code': 'CHAR 5'
            'episode_of_id': 'INT'
            'season_nr': 'INT'
            'episode_nr': 'INT'
            'series_years': 'CHAR 9'
            'md5sum': 'CHAR 32'


systems:
    mutable:
        args: >-
          --backend WasmV8
          --no-simd
          --cardinality-estimator Injected
          --use-cardinality-file benchmark/result-db-eval/job/q31a/q31a_cyclic_injected_cardinalities.json
          --plan-enumerator DPccp
        configurations:                                   # Different experiment configurations.
          'ResultDB_SemiJoin':
            args: >-
              --result-db
            pattern:
              Execution Time: '^Execute machine code:.*'
          'TD_Fold':
            args: >-
              --result-db
              --optimize-result-db
              --td_root
            pattern:
              Execution Time: '^Execute machine code:.*'
          'TD_Fold_NoTVC':
            args: >-
              --result-db
              --optimize-result-db
              --td_root
              --ignore_tvcs
            pattern:
              Execution Time: '^Execute machine code:.*'
          'TD_ResultDB':
            args: >-
              --result-db
              --optimize-result-db
            pattern:
              Execution Time: '^Execute machine code:.*'
          'ResultDB_Decompose':
            args: >-
              --decompose
            pattern:
              Execution Time: '^Execute machine code:.*'
          'GHD_Heuristic':
            args: >-
              --result-db
              --optimize-result-db
              --ghd_heuristic
            pattern:
              Execution Time: '^Execute machine code:.*'
          'GHD_C_Fold':
            args: >-
              --result-db
              --optimize-result-db
              --ghd_c_fold
            pattern:
              Execution Time: '^Execute machine code:.*'
        cases:
            0: 'SELECT mi.info, mi_idx.info, n.name, t.title FROM ci AS ci, cn AS cn, it1 AS it1, it1 AS it2, k AS k, mc AS mc, mi AS mi, mi_idx AS mi_idx, mk AS mk, n AS n, t AS t WHERE t.id = mi.movie_id AND ci.movie_id = mi.movie_id AND ci.movie_id = mk.movie_id AND ci.movie_id = mc.movie_id AND mi_idx.movie_id = mc.movie_id AND n.id = ci.person_id AND it1.id = mi.info_type_id AND it2.id = mi_idx.info_type_id AND k.id = mk.keyword_id AND cn.id = mc.company_id;'
