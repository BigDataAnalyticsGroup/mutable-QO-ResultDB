systems:
    mutable:
        args: >-
          --backend WasmV8
          --no-simd
          --cardinality-estimator Injected
          --use-cardinality-file benchmark/result-db-eval/job/q24a/q24a_cyclic_injected_cardinalities.json
          --plan-enumerator DPccp
        configurations:                                   # Different experiment configurations.
          'ResultDB_SemiJoin':
            args: >-
              --result-db
            pattern:
              Execution Time: '^Execute machine code:.*'
          'TD_Fold':
            args: >-
              --result-db
              --optimize-result-db
              --td_root
            pattern:
              Execution Time: '^Execute machine code:.*'
          'TD_Fold_NoTVC':
            args: >-
              --result-db
              --optimize-result-db
              --td_root
              --ignore_tvcs
            pattern:
              Execution Time: '^Execute machine code:.*'
          'TD_ResultDB':
            args: >-
              --result-db
              --optimize-result-db
            pattern:
              Execution Time: '^Execute machine code:.*'
          'ResultDB_Decompose':
            args: >-
              --decompose
            pattern:
              Execution Time: '^Execute machine code:.*'
          'GHD_Heuristic':
            args: >-
              --result-db
              --optimize-result-db
              --ghd_heuristic
            pattern:
              Execution Time: '^Execute machine code:.*'
          'GHD_C_Fold':
            args: >-
              --result-db
              --optimize-result-db
              --ghd_c_fold
            pattern:
              Execution Time: '^Execute machine code:.*'
        cases:
            0: 'SELECT chn.name, n.name, t.title FROM an AS an, chn AS chn, ci AS ci, cn AS cn, it AS it, k AS k, mc AS mc, mi AS mi, mk AS mk, n AS n, rt AS rt, t AS t WHERE t.id = mi.movie_id AND t.id = ci.movie_id AND mc.movie_id = mi.movie_id AND mi.movie_id = ci.movie_id AND mi.movie_id = mk.movie_id AND cn.id = mc.company_id AND it.id = mi.info_type_id AND n.id = ci.person_id AND rt.id = ci.role_id AND ci.person_id = an.person_id AND chn.id = ci.person_role_id AND k.id = mk.keyword_id;'
