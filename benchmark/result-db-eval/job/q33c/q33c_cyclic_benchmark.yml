            'series_years': 'CHAR 9'
            'md5sum': 'CHAR 32'


systems:
    mutable:
        args: >-
          --backend WasmV8
          --no-simd
          --cardinality-estimator Injected
          --use-cardinality-file benchmark/result-db-eval/job/q33c/q33c_cyclic_injected_cardinalities.json
          --plan-enumerator DPccp
        configurations:                                   # Different experiment configurations.
            'ResultDB-Heuristic':
                args: >-
                    --result-db
                pattern:
                    Execution Time: '^Process the query:.*'
            'TD_ResultDB':
                args: >-
                    --result-db
                    --optimize-result-db
                pattern:
                    Execution Time: '^Process the query:.*'
            'TD_Fold':
                args: >-
                    --result-db
                    --optimize-result-db
                    --td_root
                pattern:
                    Execution Time: '^Process the query:.*'
            'TD_Fold_NoTVC':
                args: >-
                    --result-db
                    --optimize-result-db
                    --td_root
                    --ignore_tvcs
                pattern:
                    Execution Time: '^Process the query:.*'
            'Decompose':
                args: >-
                    --decompose
                pattern:
                    Execution Time: '^Process the query:.*'
        cases:
            0: 'SELECT cn1.name, cn2.name, mi_idx1.info, mi_idx2.info, t1.title, t2.title FROM cn1 AS cn1, cn1 AS cn2, it1 AS it1, it1 AS it2, kt1 AS kt1, kt1 AS kt2, lt AS lt, mc1 AS mc1, mc1 AS mc2, mi_idx1 AS mi_idx1, mi_idx1 AS mi_idx2, ml AS ml, t1 AS t1, t1 AS t2 WHERE lt.id = ml.link_type_id AND t1.id = ml.movie_id AND t2.id = ml.linked_movie_id AND it1.id = mi_idx1.info_type_id AND t1.id = mi_idx1.movie_id AND kt1.id = t1.kind_id AND cn1.id = mc1.company_id AND t1.id = mc1.movie_id AND it2.id = mi_idx2.info_type_id AND t2.id = mi_idx2.movie_id AND kt2.id = t2.kind_id AND cn2.id = mc2.company_id AND t2.id = mc2.movie_id;'
