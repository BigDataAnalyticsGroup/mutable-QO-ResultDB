description: Join-Order Benchmark q5c.
suite: job
benchmark: job
name: q5c
readonly: true
chart:
    x:
        scale: linear
        type: O
        label: JOB Queries
    y:
        scale: linear
        type: Q
        label: 'Execution time [ms]'
    # Defaults: scale is "linear", type is "Q", label is "X" or "Y"
data:
    'ct':
        file: 'benchmark/result-db-eval/job/q5c/data/5c_ct.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'kind': 'CHAR 32 NOT NULL'
    'it':
        file: 'benchmark/result-db-eval/job/q5c/data/5c_it.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'info': 'CHAR 32 NOT NULL'
    'mc':
        file: 'benchmark/result-db-eval/job/q5c/data/5c_mc.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'movie_id': 'INT NOT NULL'
            'company_id': 'INT NOT NULL'
            'company_type_id': 'INT NOT NULL'
            'note': 'CHAR 100'
    'mi':
        file: 'benchmark/result-db-eval/job/q5c/data/5c_mi.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'movie_id': 'INT NOT NULL'
            'info_type_id': 'INT NOT NULL'
            'info': 'CHAR 43 NOT NULL'
            'note': 'CHAR 19'
    't':
        file: 'benchmark/result-db-eval/job/q5c/data/5c_t.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'title': 'CHAR 100 NOT NULL'
            'imdb_index': 'CHAR 5'
            'kind_id': 'INT NOT NULL'
            'production_year': 'INT'
            'imdb_id': 'INT'
            'phonetic_code': 'CHAR 5'
            'episode_of_id': 'INT'
            'season_nr': 'INT'
            'episode_nr': 'INT'
            'series_years': 'CHAR 9'
            'md5sum': 'CHAR 32'


systems:
    mutable:
        args: >-
          --backend WasmV8
          --no-simd
          --cardinality-estimator Injected
          --use-cardinality-file benchmark/result-db-eval/job/q5c/q5c_cyclic_injected_cardinalities.json
          --plan-enumerator DPccp
        configurations:                                   # Different experiment configurations.
            'ResultDB-Heuristic':
                args: >-
                    --result-db
                pattern:
                    Execution Time: '^Process the query:.*'
            'TD_ResultDB':
                args: >-
                    --result-db
                    --optimize-result-db
                pattern:
                    Execution Time: '^Process the query:.*'
            'TD_Fold':
                args: >-
                    --result-db
                    --optimize-result-db
                    --td_root
                pattern:
                    Execution Time: '^Process the query:.*'
            'TD_Fold_NoTVC':
                args: >-
                    --result-db
                    --optimize-result-db
                    --td_root
                    --ignore_tvcs
                pattern:
                    Execution Time: '^Process the query:.*'
            'Decompose':
                args: >-
                    --decompose
                pattern:
                    Execution Time: '^Process the query:.*'
        cases:
            0: 'SELECT t.title FROM ct AS ct, it AS it, mc AS mc, mi AS mi, t AS t WHERE t.id = mi.movie_id AND t.id = mc.movie_id AND mc.movie_id = mi.movie_id AND ct.id = mc.company_type_id AND it.id = mi.info_type_id;'
