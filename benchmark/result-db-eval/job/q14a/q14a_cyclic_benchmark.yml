description: Join-Order Benchmark q14a.
suite: job
benchmark: job
name: q14a
readonly: true
chart:
    x:
        scale: linear
        type: O
        label: JOB Queries
    y:
        scale: linear
        type: Q
        label: 'Execution time [ms]'
    # Defaults: scale is "linear", type is "Q", label is "X" or "Y"
data:
    'it1':
        file: 'benchmark/result-db-eval/job/q14a/data/14a_it1.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'info': 'CHAR 32 NOT NULL'
    'it2':
        file: 'benchmark/result-db-eval/job/q14a/data/14a_it2.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'info': 'CHAR 32 NOT NULL'
    'k':
        file: 'benchmark/result-db-eval/job/q14a/data/14a_k.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'keyword': 'CHAR 74 NOT NULL'
            'phonetic_code': 'CHAR 5'
    'kt':
        file: 'benchmark/result-db-eval/job/q14a/data/14a_kt.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'kind': 'CHAR 15 NOT NULL'
    'mi':
        file: 'benchmark/result-db-eval/job/q14a/data/14a_mi.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'movie_id': 'INT NOT NULL'
            'info_type_id': 'INT NOT NULL'
            'info': 'CHAR 43 NOT NULL'
            'note': 'CHAR 19'
    'mi_idx':
        file: 'benchmark/result-db-eval/job/q14a/data/14a_mi_idx.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'movie_id': 'INT NOT NULL'
            'info_type_id': 'INT NOT NULL'
            'info': 'CHAR 3 NOT NULL'
            'note': 'CHAR 1'
    'mk':
        file: 'benchmark/result-db-eval/job/q14a/data/14a_mk.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'movie_id': 'INT NOT NULL'
            'keyword_id': 'INT NOT NULL'
    't':
        file: 'benchmark/result-db-eval/job/q14a/data/14a_t.csv'
        format: 'csv'
        delimiter: ','
        header: 0
        attributes:
            'id': 'INT NOT NULL'
            'title': 'CHAR 100 NOT NULL'
            'imdb_index': 'CHAR 5'
            'kind_id': 'INT NOT NULL'
            'production_year': 'INT'
            'imdb_id': 'INT'
            'phonetic_code': 'CHAR 5'
            'episode_of_id': 'INT'
            'season_nr': 'INT'
            'episode_nr': 'INT'
            'series_years': 'CHAR 9'
            'md5sum': 'CHAR 32'


systems:
    mutable:
        args: >-
          --backend WasmV8
          --no-simd
          --cardinality-estimator Injected
          --use-cardinality-file benchmark/result-db-eval/job/q14a/q14a_cyclic_injected_cardinalities.json
          --plan-enumerator DPccp
        configurations:                                   # Different experiment configurations.
            'ResultDB-Heuristic':
                args: >-
                    --result-db
                pattern:
                    Execution Time: '^Process the query:.*'
            'TD_ResultDB':
                args: >-
                    --result-db
                    --optimize-result-db
                pattern:
                    Execution Time: '^Process the query:.*'
            'TD_Fold':
                args: >-
                    --result-db
                    --optimize-result-db
                    --td_root
                pattern:
                    Execution Time: '^Process the query:.*'
            'TD_Fold_NoTVC':
                args: >-
                    --result-db
                    --optimize-result-db
                    --td_root
                    --ignore_tvcs
                pattern:
                    Execution Time: '^Process the query:.*'
            'Decompose':
                args: >-
                    --decompose
                pattern:
                    Execution Time: '^Process the query:.*'
        cases:
            0: 'SELECT mi_idx.info, t.title FROM it1 AS it1, it1 AS it2, k AS k, kt AS kt, mi AS mi, mi_idx AS mi_idx, mk AS mk, t AS t WHERE kt.id = t.kind_id AND t.id = mi.movie_id AND t.id = mk.movie_id AND t.id = mi_idx.movie_id AND mk.movie_id = mi.movie_id AND mk.movie_id = mi_idx.movie_id AND mi.movie_id = mi_idx.movie_id AND k.id = mk.keyword_id AND it1.id = mi.info_type_id AND it2.id = mi_idx.info_type_id;'
