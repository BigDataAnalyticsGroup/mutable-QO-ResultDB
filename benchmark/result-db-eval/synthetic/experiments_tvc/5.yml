description: Optimize synthetic Cycle Schema Query with RESULTDB
suite: synthetic
benchmark: RESULTDB Optimization + Execution times with synthetic cycle schema
name: Exp5
readonly: true
chart:
    x:
        scale: linear
        type: O
        label: Scale factor
    y:
        scale: linear
        type: Q
        label: 'Optimization Time [ms]'
