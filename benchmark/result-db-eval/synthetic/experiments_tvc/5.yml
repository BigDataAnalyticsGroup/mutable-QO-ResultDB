systems:
    mutable:
        args: >-
          --backend WasmV8
          --no-simd
          --plan
          --plan-enumerator DPccp
          -t
          --cardinality-estimator Injected
          --use-cardinality-file benchmark/result-db-eval/synthetic/experiments_tvc/5_injected_cardinalities.json
        configurations:
          'ResultDB_SemiJoin':
            args: >-
              --result-db
            pattern:
              Execution Time: '^Execute machine code:.*'
          'TD_Fold':
            args: >-
              --result-db
              --optimize-result-db
              --td_root
            pattern:
              Execution Time: '^Execute machine code:.*'
          'TD_Fold_NoTVC':
            args: >-
              --result-db
              --optimize-result-db
              --td_root
              --ignore_tvcs
            pattern:
              Execution Time: '^Execute machine code:.*'
          'TD_ResultDB':
            args: >-
              --result-db
              --optimize-result-db
            pattern:
              Execution Time: '^Execute machine code:.*'
          'ResultDB_Decompose':
            args: >-
              --decompose
            pattern:
              Execution Time: '^Execute machine code:.*'
          'GHD_Heuristic':
            args: >-
              --result-db
              --optimize-result-db
              --ghd_heuristic
            pattern:
              Execution Time: '^Execute machine code:.*'
          'GHD_C_Fold':
            args: >-
              --result-db
              --optimize-result-db
              --ghd_c_fold
            pattern:
              Execution Time: '^Execute machine code:.*'
        cases:
            5:  SELECT *
                FROM rel_0 AS r_0, rel_1 AS r_1, rel_2 AS r_2, rel_3 AS r_3, rel_4 AS r_4, rel_5 AS r_5, rel_6 AS r_6, rel_7 AS r_7
                WHERE r_0.d1=r_1.f AND r_1.a=r_2.a1 AND r_2.a2=r_3.a1 AND r_2.a3=r_5.a3 AND r_3.a2=r_4.a1 AND r_4.a2=r_5.a1
                      AND r_5.a2 = r_6.a2 AND r_6.a1 = r_7.a
                      AND r_6.a3=r_1.a AND r_7.f=r_0.d2 AND r_0.id < 1000;